# Accepted Trivy findings. Each entry needs a reason; remove it if the design changes.
misconfigurations:
  # A customer-managed KMS key adds a monthly cost and gains nothing for content that is public anyway.
  - id: AWS-0132
    paths: [s3.tf, events.tf]
    statement: Site content is public; the events bucket holds a children's game's questions behind AWS access control, so SSE-S3 (AES256) is sufficient and a customer-managed key would only add cost.
  # No WAF by design: it costs roughly $6/month and this is a static page with no endpoints to abuse.
  - id: AWS-0011
    paths: [cloudfront.tf]
    statement: No WAF on the CloudFront distribution by design (cost); the static site has no sensitive endpoints.
  # With no custom domain, CloudFront's default *.cloudfront.net certificate cannot enforce a TLS minimum.
  # Setting domain_name switches to an ACM certificate with TLSv1.2_2021.
  - id: AWS-0013
    paths: [cloudfront.tf]
    statement: Default CloudFront certificate cannot set a TLS minimum; a custom domain (domain_name) enforces TLSv1.2_2021.
  # CloudWatch metric reads and Lambda account settings do not support resource-level permissions, so Resource must be "*".
  # Both actions are read-only, used by the manually run load test report.
  - id: AWS-0057
    paths: [iam.tf]
    statement: Read-only CloudWatch/Lambda account actions that do not support resource-level permissions (load test report).
