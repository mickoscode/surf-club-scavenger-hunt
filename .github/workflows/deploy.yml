name: Deploy site

# Deploys the backend code and the site on every merge to main that touches either, and on manual dispatch.
# Run it from main: the deploy role (terraform/iam.tf) only trusts the main branch.
# Infrastructure comes first: the bucket, distribution, functions and role are created by terraform-apply.yml.
# The game itself (questions, maps, instructions) is not deployed: it is an event the admin uploads on /game-events/.
on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "api/**"
      - "scripts/build.sh"
      - "scripts/package-backend.sh"
      - "scripts/smoke-test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write # request the OIDC token to assume the AWS role
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BUCKET: sorrento-sls-scavenger-hunt
      AWS_REGION: ap-southeast-2
      PUBLIC_FUNCTION: scavenger-hunt-public
      ADMIN_FUNCTION: scavenger-hunt-admin
      # Repository variables (Settings > Secrets and variables > Actions > Variables), from the Terraform outputs.
      CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }} # the site's address, e.g. https://d123abc.cloudfront.net (the site_url output)

    steps:
      - name: Check configuration
        run: |
          if [ -z "$CF_DISTRIBUTION_ID" ] || [ -z "$SITE_URL" ]; then
            echo "::error::Repository variables CF_DISTRIBUTION_ID and SITE_URL must both be set. Apply the Terraform first, then set them from the cloudfront_distribution_id and site_url outputs (see docs/setup.md)."
            exit 1
          fi

      - name: Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Builds dist/ and runs the unit and in-memory API tests; nothing is deployed if they fail.
      - name: Build and test
        run: npm test

      # The backend carries a copy of the questions, so check they are well formed before they go anywhere.
      - name: Validate game data
        run: node scripts/validate-game-data.js

      # build/backend = the runtime code of api/ plus the game file (scripts/package-backend.sh).
      - name: Package backend
        run: |
          bash scripts/package-backend.sh
          (cd build/backend && zip -qr ../backend.zip .)

      # Assumes the deploy IAM role via GitHub OIDC (role defined in terraform/iam.tf);
      # no long-lived keys are stored in GitHub secrets.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::722937635825:role/scavenger-hunt-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      # The functions' code is deployed here, not by Terraform (terraform/lambda.tf ignores it). The backend goes
      # first so the site never calls an API route that does not exist yet.
      - name: Deploy backend
        run: |
          for fn in "$PUBLIC_FUNCTION" "$ADMIN_FUNCTION"; do
            aws lambda update-function-code --function-name "$fn" --zip-file fileb://build/backend.zip --query 'LastModified' --output text
            aws lambda wait function-updated --function-name "$fn"
          done

      # dist/ is the whole bucket except event-maps/, which the admin function writes when an event is activated: --exclude
      # keeps --delete from removing them. "no-cache" makes browsers re-check a file (a cheap ETag request) instead of
      # reusing a possibly stale copy.
      - name: Sync dist to S3
        run: aws s3 sync ./dist/ "s3://$BUCKET" --delete --exclude "event-maps/*" --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID" --paths "/*"

      # Read-only checks of the live site and API (retried while the deploy reaches every edge location).
      # A failure here does not roll anything back: fix forward, or revert the PR and run this workflow again.
      - name: Smoke test
        run: node scripts/smoke-test.js "$SITE_URL"
