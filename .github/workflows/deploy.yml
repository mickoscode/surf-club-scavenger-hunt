name: Deploy site

# Deploys the site to S3 on every merge to main that touches the frontend, and on manual dispatch.
# Run it from main: the deploy role (terraform/iam.tf) only trusts the main branch.
# Infrastructure comes first: the bucket, distribution and role are created by terraform-apply.yml.
on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "scripts/build.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write # request the OIDC token to assume the AWS role
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BUCKET: sorrento-sls-scavenger-hunt
      AWS_REGION: ap-southeast-2
      # Repository variable (Settings > Secrets and variables > Actions > Variables), from the
      # cloudfront_distribution_id Terraform output.
      CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}

    steps:
      - name: Check configuration
        run: |
          if [ -z "$CF_DISTRIBUTION_ID" ]; then
            echo "::error::Repository variable CF_DISTRIBUTION_ID is not set. Apply the Terraform first, then set it from the cloudfront_distribution_id output (see docs/setup.md)."
            exit 1
          fi

      - name: Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and test
        run: npm test

      # Assumes the deploy IAM role via GitHub OIDC (role defined in terraform/iam.tf);
      # no long-lived keys are stored in GitHub secrets.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::722937635825:role/scavenger-hunt-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      # dist/ is the whole bucket, so one sync (with --delete) is enough. "no-cache" makes browsers re-check a
      # file (a cheap ETag request) instead of reusing a possibly stale copy.
      - name: Sync dist to S3
        run: aws s3 sync ./dist/ "s3://$BUCKET" --delete --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID" --paths "/*"
