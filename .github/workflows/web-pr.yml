name: Web PR checks

# Builds the site and runs the build test on pull requests that touch the frontend, so a broken page,
# a missing file or a Content-Security-Policy violation is caught before merge (merging to main deploys to prod).
# Jobs are skipped (not absent) when the frontend is unchanged, so "Validate site" can be a required check.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: web-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect web changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for web changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qE '^(web/|tests/|scripts/build\.sh$|package(-lock)?\.json$|terraform/cloudfront\.tf$|\.github/workflows/(web-pr|deploy)\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  validate-site:
    name: Validate site
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      # --ignore-scripts: no dependency may run install-time code in CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Builds dist/ (the test does this too) and checks it against the Content-Security-Policy.
      - name: Build and test
        run: npm test
