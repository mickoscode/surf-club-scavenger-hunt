version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Provider updates (also refreshes terraform/.terraform.lock.hcl).
  # The PR gets the usual plan check; review the plan comment before merging.
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
    groups:
      terraform:
        patterns:
          - "*"

  # Bootstrap. Merging a bump deploys it to the live site, so check the PR's build and test run.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
