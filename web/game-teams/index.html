<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teams - admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/site.css">
  <script type="module" src="/js/teams-page.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
  <main class="container py-4">
    <div class="mx-auto narrow">
      <!-- Shown instead of the page until the admin passcode has been entered (see js/admin-auth.js). -->
      <section class="card card-body" data-testid="login-panel" hidden>
        <h1 class="h4">Admin login</h1>
        <form data-testid="login-form" novalidate>
          <!-- for password managers: the login is one account -->
          <input type="text" name="username" value="admin" autocomplete="username" class="visually-hidden" tabindex="-1" aria-hidden="true" readonly>
          <label class="form-label" for="passcode">Admin passcode</label>
          <input class="form-control form-control-lg mb-3" id="passcode" name="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" data-testid="passcode-input">
          <button class="btn btn-primary w-100" type="submit" data-testid="login-button">Log in</button>
          <p class="text-danger mt-2 mb-0" role="alert" data-testid="login-error" hidden></p>
        </form>
      </section>

      <div data-testid="admin-content" hidden>
        <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
          <nav aria-label="Admin pages"><ul class="nav nav-pills flex-wrap" data-testid="admin-nav"></ul></nav>
          <button class="btn btn-outline-secondary btn-sm" type="button" data-testid="logout-button" hidden>Log out</button>
        </div>

        <p class="alert alert-warning" data-testid="load-error" hidden>Could not refresh. Trying again...</p>

        <!-- The live scoreboard, the same as players and viewers see; tap a team to see its answers. -->
        <div data-testid="teams-list-view">
          <h1 class="h3 mb-1">Teams</h1>
          <p class="small text-muted">The live scoreboard. Tap a team to see everything it has submitted.</p>
          <h2 class="h6 fw-semibold text-muted mb-1" data-testid="scoreboard-heading" data-published="false" hidden>provisional results:</h2>
          <table class="table table-sm align-middle" data-testid="scoreboard" hidden>
            <thead>
              <tr><th scope="col" class="text-muted">rank</th><th scope="col">name</th><th scope="col" class="text-end">done</th><th scope="col" class="text-end">score</th></tr>
            </thead>
            <tbody data-testid="scoreboard-body"></tbody>
          </table>
          <p class="text-center text-muted" data-testid="no-teams" hidden>No teams yet.</p>
        </div>

        <!-- One team's answers, exactly as the team will see them when the results are published. -->
        <div data-testid="team-view" hidden>
          <p class="mb-3"><a href="#" data-testid="back-to-teams">&lsaquo; All teams</a></p>
          <p class="text-center text-muted small mb-1 team-name" data-testid="team-note"></p>
          <h2 class="display-6 fw-bold text-center mb-1 team-name" data-testid="place-heading"></h2>
          <p class="text-center fs-5 mb-4" data-testid="total"></p>
          <div data-testid="result-zones"></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
